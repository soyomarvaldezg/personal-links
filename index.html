<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Omar Valdez — Data Architecture, Data Engineering and AI Systems."
  >

  <title>Omar Valdez | Links</title>

  <style>
    :root {
      --background: #1a1b26;
      --surface: #24283b;
      --surface-hover: #2f354f;
      --text: #c0caf5;
      --muted: #a9b1d6;
      --accent: #7dcfff;
      --border: #414868;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #24283b 0%, var(--background) 45%);
    }

    main {
      width: 100%;
      max-width: 620px;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 2px solid var(--accent);
      border-radius: 50%;
      background: var(--surface);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .handle {
      margin: 8px 0 14px;
      color: var(--accent);
    }

    .description {
      max-width: 500px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .link {
      width: 100%;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition:
        transform 150ms ease,
        border-color 150ms ease,
        background 150ms ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .link:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 28px 16px;
      }

      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">OV</div>

      <h1>Omar Valdez</h1>

      <p class="handle">@soyomarvaldezg</p>

      <p class="description">
        Data Architecture, Data Engineering and AI Systems.
        Entiende primero. Implementa después.

        target="_blank"

      >
        Desde los Datos — Spotify
      </a>

      <a

        href="https://www.linkedin.com/in/soyomarvaldezg"

      <a

      <a

      <a
        class="link"

      <a

    </section>

    <footer>
      © 2026 Omar Valdez
    </footer>
  </main>
</body>
</html>
